services:
  - type: web
    name: ai-mod-backend
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/aksuharun/Streaimod
    branch: dev
    rootDir: .
    buildCommand: npm ci && npm run build --workspace @ai-mod/backend
    startCommand: npm run start --workspace @ai-mod/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-nano
      - key: RAISON_API_KEY
        sync: false
      - key: RAISON_QNA_PROMPT_ID
        value: 6a10c0f77a74ff59899f61e5
      - key: RAISON_NORMALIZE_PROMPT_ID
        value: 6a1775683bed3b22a56548d7
      - key: RAISON_BAN_PROMPT_ID
        value: 6a1776613bed3b22a5654afc
      - key: RAISON_TIMEOUT_PROMPT_ID
        value: 6a1773313bed3b22a56545ec
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_CLIENT_ID_1
        sync: false
      - key: YOUTUBE_CLIENT_SECRET_1
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: AUTH_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY_1
        sync: false
      - key: YOUTUBE_TIMEOUT_DURATION_SECONDS
        value: "300"
      - key: STREAM_OVERVIEW_CACHE_TTL_MS
        value: "60000"
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
        - .env.schema
